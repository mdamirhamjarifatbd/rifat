<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Crash - Offline Version</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0b0e14; --card: #151a24; --accent: #00e676; --danger: #ff5252; --warning: #ffab40; }
        body { margin: 0; background: var(--bg); font-family: 'Poppins', sans-serif; color: white; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        #game-screen { position: relative; width: 100%; max-width: 500px; height: 380px; background: radial-gradient(circle at center, #1e293b, #0b0e14); overflow: hidden; border-bottom: 2px solid #222; }
        
        #multiplier { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 70px; font-weight: 900; z-index: 10; font-family: 'Monospace'; text-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #rocket { position: absolute; bottom: 40px; left: 40px; font-size: 50px; z-index: 5; transition: transform 0.1s linear; filter: drop-shadow(0 0 15px var(--accent)); }
        
        /* ১০ সেকেন্ডের সার্কুলার টাইমার */
        .timer-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 140px; height: 140px; display: none; z-index: 1001;
        }
        .timer-svg { transform: rotate(-90deg); width: 140px; height: 140px; }
        .timer-bg { fill: none; stroke: rgba(255, 255, 255, 0.1); stroke-width: 8; }
        .timer-bar {
            fill: none; stroke: var(--accent); stroke-width: 8;
            stroke-dasharray: 440; stroke-dashoffset: 440;
            stroke-linecap: round; transition: stroke-dashoffset 1s linear;
        }
        #timer-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; font-weight: bold; color: var(--accent); }

        .controls { width: 100%; max-width: 500px; padding: 25px; background: var(--card); border-radius: 30px 30px 0 0; text-align: center; }
        .btn-main { width: 90%; height: 60px; border-radius: 15px; border: none; font-size: 20px; font-weight: bold; color: #000; cursor: pointer; background: var(--accent); }
    </style>
</head>
<body>

    <div id="game-screen">
        <div id="multiplier">1.00x</div>

        <div class="timer-container" id="timerBox">
            <svg class="timer-svg">
                <circle class="timer-bg" cx="70" cy="70" r="65"></circle>
                <circle class="timer-bar" id="timerBar" cx="70" cy="70" r="65"></circle>
            </svg>
            <div id="timer-text">10</div>
        </div>
        
        <div id="rocket">🚀</div>
    </div>

    <div class="controls">
        <button id="actionBtn" class="btn-main">WAITING...</button>
    </div>

<script>
    let multiplier = 1.00;
    let isRunning = false;
    let crashPoint = 0;
    let gameLoop;

    const multDisplay = document.getElementById('multiplier');
    const rocket = document.getElementById('rocket');
    const actionBtn = document.getElementById('actionBtn');
    const timerBox = document.getElementById('timerBox');
    const timerBar = document.getElementById('timerBar');
    const timerText = document.getElementById('timerText');

    // গেম শুরু করার লজিক
    function startNewRound() {
        // ১. ১০ সেকেন্ডের টাইমার শুরু
        multiplier = 1.00;
        isRunning = false;
        multDisplay.innerText = "1.00x";
        multDisplay.style.color = "white";
        rocket.style.opacity = "1";
        rocket.style.transform = `translate(0px, 0px)`;
        
        showTimer(10);
    }

    function showTimer(seconds) {
        timerBox.style.display = 'block';
        let timeLeft = seconds;
        actionBtn.innerText = "NEXT ROUND IN " + timeLeft + "s";
        
        let countdown = setInterval(() => {
            timeLeft--;
            let offset = 440 - (timeLeft / seconds) * 440;
            timerBar.style.strokeDashoffset = offset;
            timerText.innerText = timeLeft;
            actionBtn.innerText = "NEXT ROUND IN " + timeLeft + "s";

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerBox.style.display = 'none';
                launchRocket();
            }
        }, 1000);
    }

    function launchRocket() {
        isRunning = true;
        crashPoint = (Math.random() * 5 + 1.1).toFixed(2); // ১.১ থেকে ৫ এর মধ্যে যেকোনো জায়গায় ক্রাশ হবে
        actionBtn.innerText = "ROCKET IS FLYING!";
        
        gameLoop = setInterval(() => {
            multiplier += 0.03; // বিমানের স্পিড
            multDisplay.innerText = multiplier.toFixed(2) + "x";
            
            // বিমান উপরে ওঠার অ্যানিমেশন
            let x = (multiplier - 1) * 60;
            let y = (multiplier - 1) * 40;
            rocket.style.transform = `translate(${x}px, -${y}px)`;

            // ক্রাশ লজিক
            if (multiplier >= crashPoint) {
                clearInterval(gameLoop);
                crashGame();
            }
        }, 100);
    }

    function crashGame() {
        isRunning = false;
        multDisplay.style.color = "#ff5252";
        rocket.style.opacity = "0";
        actionBtn.innerText = "CRASHED AT " + multiplier.toFixed(2) + "x";

        // ৩ সেকেন্ড পর আবার নতুন রাউন্ড শুরু
        setTimeout(startNewRound, 3000);
    }

    // গেমটি প্রথমবার চালু করা
    startNewRound();
</script>
</body>
</html>
